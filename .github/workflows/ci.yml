name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore BluetoothOff.slnx --locked-mode --configfile NuGet.Config

      - name: Verify formatting and analyzers
        run: dotnet format BluetoothOff.slnx --no-restore --verify-no-changes

      - name: Run release tests
        run: dotnet test BluetoothOff.slnx --configuration Release --no-restore

      - name: Verify self-contained publish
        run: >-
          dotnet publish src/BluetoothOff/BluetoothOff.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/ci-publish
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
